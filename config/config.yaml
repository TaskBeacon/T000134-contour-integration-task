subinfo_fields:
- name: subject_id
  type: int
  constraints:
    min: 101
    max: 999
    digits: 3
subinfo_mapping:
  subject_id: 被试编号（3位数字）
  Participant Information: 被试信息
  registration_failed: 登记失败
  registration_successful: 登记成功
  invalid_input: '{field} 输入无效'
window:
  size:
  - 1280
  - 800
  units: pix
  screen: 0
  bg_color: '#808080'
  fullscreen: false
  monitor_width_cm: 35.5
  monitor_distance_cm: 60
task:
  task_name: Contour Integration Task
  language: Chinese
  voice_enabled: false
  voice_name: zh-CN-YunyangNeural
  save_path: ./outputs/human
  total_blocks: 2
  total_trials: 100
  trial_per_block: 50
  conditions:
  - bend_15
  - bend_30
  - bend_45
  - bend_60
  - bend_75
  condition_weights: null
  exemplars_per_bend: 20
  diagnostic: false
  key_list:
  - space
  - f
  - j
  report_keys:
  - f
  - j
  first_key: f
  second_key: j
  continue_key: space
  overall_seed: 134031
  seed_mode: same_across_sub
  hide_cursor: true
  delta: 0
  material_version: gabor-paired-v1
timing:
  fixation_duration: 0.5
  array_duration: 1.0
  gap_duration: 1.0
  report_duration: 4.0
  intertrial_duration: 0.3
stimuli:
  instruction:
    type: text
    font: SimHei
    text: '轮廓整合任务


      每次会先后出现两幅灰色图案，各显示1秒。

      其中一幅藏着由12个小条纹首尾相连的弯曲路径。

      另一幅没有设计的路径；不要只寻找某一种方向或更密的区域。


      每次先看中央十字，图案出现后可以自然观察整幅图。

      两幅图消失、问题出现后再作答：F＝第一幅，J＝第二幅。

      每次最多4秒；不确定也请尽量选择。图案中不需要按键。


      共两组，每组50次，组间可以休息。请不要调整窗口或缩放。

      此任务未做屏幕标定，没有个人视觉能力或临床常模。


      准备好后按空格。'
    color: black
    height: 24
    wrapWidth: 1100
    pos:
    - 0
    - 0
    units: pix
  fixation:
    type: text
    font: SimHei
    text: +
    color: black
    height: 28
    wrapWidth: 1100
    pos:
    - 0
    - 0
    units: pix
  report_prompt:
    type: text
    font: SimHei
    text: 哪一幅包含连续的弯曲路径？
    color: black
    height: 24
    wrapWidth: 1100
    pos:
    - 0
    - 0
    units: pix
  block_break:
    type: text
    font: SimHei
    text: '本组完成，可以休息。


      请保持显示设置和观察距离不变。

      按空格继续下一组。'
    color: black
    height: 24
    wrapWidth: 1100
    pos:
    - 0
    - 0
    units: pix
  good_bye:
    type: text
    font: SimHei
    text: '任务完成，谢谢参与。


      按空格结束并保存数据。'
    color: black
    height: 24
    wrapWidth: 1100
    pos:
    - 0
    - 0
    units: pix
